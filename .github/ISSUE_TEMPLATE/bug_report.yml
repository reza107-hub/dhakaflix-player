name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File or folder on DhakaFlix (if playback related)
      placeholder: "English Movies (1080p)/(2002) 1080p/..."
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, Windows, Linux]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / OS version
      placeholder: "Redmi Note 9 Pro, Android 12"
  - type: input
    id: version
    attributes:
      label: App version (Settings → About)
      placeholder: "1.0.0"
